<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>table</title>
</head>

<body>
    <table class="w-full text-sm text-left rtl:text-right text-body hover:text-white hover:bg-black hover:border hover:border-amber-50 duration-300 ease-in">
        <thead>
            <tr>
                <th class="border border-gray-950 p-2">Song</th>
                <th class="border border-gray-950 p-2">Artist</th>
                <th class="border border-gray-950 p-2">Year</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="border border-gray-950 p-2">The Sliding Mr. Bones (Next Stop, Pottersville)</td>
                <td class="border border-gray-950 p-2">Malcolm Lockyer</td>
                <td class="border border-gray-950 p-2">1961</td>
            </tr>
            <tr>
                <td class="border border-gray-950 p-2">Witchy Woman</td>
                <td class="border border-gray-950 p-2">The Eagles</td>
                <td class="border border-gray-950 p-2">1972</td>
            </tr>
            <tr>
                <td class="border border-gray-950 p-2">Shining Star</td>
                <td class="border border-gray-950 p-2">Earth, Wind, and Fire</td>
                <td class="border border-gray-950 p-2">1975</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
