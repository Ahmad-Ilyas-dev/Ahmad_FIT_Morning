<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Practise</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .grid-section{
            background-color: burlywood;
            height: 500px;
        }

        .grid-container{
            display: grid;
            grid-template-columns: 100px 200px 100px;
            grid-template-rows: 200px 100px 200px;
            justify-content: center;
            align-items: start;
            justify-items: center;
            /* align-content: center; */
            gap: 10px;
        }

        .grid-container div{
            background-color: blue;
            
        }

        /* .grid-container .items1{
            grid-row: 1 / 3;
            grid-column: 1 / 3;
        } */

    </style>

</head>
<body>
    <header></header>
    <main>
        <section class="grid-section">
            <h2>Grid Practise</h2>
            <div class="grid-container">
                <div class="items1">this is grid practise</div>
                <div class="items">this is grid practise</div>
                <div class="items">this is grid practise</div>
                <div class="items">this is grid practise</div>
                <div class="items">this is grid practise</div>
            </div>
        </section>
    </main>
</body>
</html>
