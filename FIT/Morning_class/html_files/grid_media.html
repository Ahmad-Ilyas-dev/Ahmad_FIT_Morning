<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Work</title>

    <style>

        .main_con{
            width: 100%;
            height: 400px;
            background-color: antiquewhite;
            display: grid;
            grid-template-columns: 120px 120px 120px 120px 120px 120px;
            grid-template-rows: 50px 50px 50px 50px 50px 50px ;
            justify-content: center;
            align-content: center;
            justify-items: center;
            align-items: center;
        }

        .main_con div{
            background-color: aqua;
            border: 1px solid red;
            padding: 10px;
        }

        @media(max-width:768px){
            .main_con{
                background-color: brown;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        @media(max-width:320px){
            .main_con{
                background-color: greenyellow;
                display: grid;
                grid-template-columns: 1fr 1fr ;
            }
        }



    </style>


</head>
<body>
    <div class="main_con">
        <div class="items">this is con 1</div>
        <div class="items">this is con 2</div>
        <div class="items">this is con 3</div>
        <div class="items">this is con 4</div>
        <div class="items">this is con 5</div>
        <div class="items">this is con 6</div>
    </div>
</body>
</html>
