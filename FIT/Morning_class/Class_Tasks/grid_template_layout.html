<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>

body{
    background-color: rgb(221, 230, 230);
    color: white;
}

.container{
    display: grid;
    grid-template-columns: 200px 1fr 200px;
    grid-template-rows: 80px auto 80px;
    gap: 10px;

    grid-template-areas:
        "header header header"
        "sidebar main aside"
        "footer footer footer";
}

header{
    grid-area: header;
    background-color: orangered;
    text-align: center;
    border-radius: 10px;
}

.sidebar{
    grid-row: 2 / 3;
    grid-area: sidebar;
    background-color: #3d3c3c;
    height: 400px;
    border-radius: 10px;
    text-align: center;
}

main{
    grid-area: main;
    background-color: white;
    border-radius: 10px;
    padding: 10px;
}

.sidebar2{
    grid-area: aside;
    background-color: teal;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    border-radius: 10px;
}



.hero{
    display: grid;
    gap: 10px;

    grid-template-columns: repeat(3, 1fr);
    grid-template-areas:
        "featured featured featured"
        "a b c";
}

.hero div{
    background: #4f7ea8;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    height: 100px;
}

.hero .div1{
    grid-area: featured;
    background: orangered;
    height: 120px;
    height: 180px;
}

.hero .div2{ 
    grid-area: a; 
    height: 200px;
}
.hero .div3{ 
    grid-area: b; 
    height: 200px;
}
.hero .div4{ 
    grid-area: c; 
    height: 200px;
}


footer{
    grid-area: footer;
    background-color: #3d3c3c;
    text-align: center;
    border-radius: 10px;
}

</style>

</head>
<body>

<div class="container">
    <header><h2>Header</h2></header>

    <aside class="sidebar"><h2>Sidebar</h2></aside>

    <main>
        <section class="hero">
            <div class="div1"><h2>Featured</h2></div>
            <div class="div2"><h2>A</h2></div>
            <div class="div3"><h2>B</h2></div>
            <div class="div4"><h2>C</h2></div>
        </section>
    </main>

    <aside class="sidebar2"><h2>Aside</h2></aside>

    <footer><h2>Footer</h2></footer>
</div>

</body>
</html>
